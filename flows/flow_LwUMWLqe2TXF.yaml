blueprint:
  name: AWTRIX NG Rain Forecast TC002 (52×16)
  description: 'Shows an hourly rain forecast on one or more AWTRIX NG displays with
    a 52×16 panel (Ulanzi TC002), and refreshes it automatically whenever the forecast
    changes. Uses an AWTRIX NG layout: a 16×16 animated weather icon on the left,
    the expected total rain (mm) on the top line and a bar or line chart of the coming
    hours below it. When no rain is expected it shows a text instead. The 16×16 icons
    are built into this blueprint, so nothing has to be uploaded to the clock first.
    Built for the AWTRIX NG MQTT API. V1.0'
  domain: automation
  author: LeonCB
  homeassistant:
    min_version: 2025.2.0
  input:
    awtrix_displays:
      name: AWTRIX Displays
      description: Select the target AWTRIX NG TC002 displays. Needs HA discovery
        enabled on each device - the blueprint reads its MQTT prefix from the "MQTT
        prefix" sensor.
      selector:
        device:
          filter:
          - integration: mqtt
            manufacturer: Blueforcer
          multiple: true
      default: []
    extra_prefixes:
      name: Extra MQTT prefixes
      description: Optional. MQTT topic prefixes of displays that are not in Home
        Assistant - the mqttPrefix from their MQTT settings, or the 12-character device
        uid when that field is empty. Commands go to <prefix>/cmd/apps/pushed/rain_forecast.
      selector:
        text:
          multiple: true
          multiline: false
      default: []
    my_sensor:
      name: Sensor
      description: Select your Weather Sensor. It must provide an hourly forecast.
      selector:
        entity:
          filter:
          - domain:
            - weather
          multiple: false
          reorder: false
    hours:
      name: Hours
      description: Number of hours shown in the chart. The chart is 34 pixels wide,
        so about 12 hours gives clear bars; up to 34 still fits one pixel per hour.
      selector:
        number:
          mode: slider
          min: 4.0
          max: 34.0
          step: 1.0
      default: 12
    language:
      name: Language
      description: Language used for the "no rain expected" text.
      selector:
        select:
          options:
          - label: English
            value: en
          - label: Danish
            value: dk
          - label: Dutch
            value: nl
          - label: French
            value: fr
          - label: German
            value: de
          - label: Italian
            value: it
          - label: Polish
            value: pl
          - label: Portuguese
            value: pt
          - label: Russian
            value: ru
          - label: Spanish
            value: es
          mode: dropdown
          multiple: false
          custom_value: false
          sort: false
      default: en
    my_text:
      name: Custom Text
      description: Optional. Overrides the translated "no rain expected" text. Leave
        empty to use the text for the selected Language.
      selector:
        text:
          multiline: false
          multiple: false
      default: ''
    graph_type:
      name: Graph Type
      description: Select bar chart or line chart.
      selector:
        select:
          options:
          - label: Bar Chart
            value: bar
          - label: Line Chart
            value: line
          mode: dropdown
          multiple: false
          custom_value: false
          sort: false
      default: bar
    show_total:
      name: Show total
      description: Show the expected total rain (mm) for the chosen hours above the
        chart. When off, the chart uses the full height.
      selector:
        boolean: {}
      default: true
    autoscale:
      name: Autoscale
      description: Scales the chart to the highest value. When off, the chart runs
        from 0 to the "Chart maximum" below, so light and heavy rain look different.
      selector:
        boolean: {}
      default: true
    chart_max:
      name: Chart maximum (mm per hour)
      description: Only used when Autoscale is off.
      selector:
        number:
          mode: box
          min: 0.5
          max: 50.0
          step: 0.5
          unit_of_measurement: mm
      default: 5
    icon_source:
      name: Icon source
      description: '"Built-in" sends the 16×16 animated icon for the current weather
        from this blueprint with every update. "Icons on the clock" uses icons stored
        on the clock instead, named <prefix><weather state>. Careful: if such an icon
        is missing, AWTRIX NG refuses the whole update.'
      selector:
        select:
          options:
          - label: Built-in 16×16 icons
            value: builtin
          - label: Icons on the clock
            value: clock
          - label: No icon
            value: none
          mode: dropdown
          multiple: false
          custom_value: false
          sort: false
      default: builtin
    icon_prefix:
      name: Icon name prefix
      description: Only for "Icons on the clock". Put in front of the weather state
        to form the icon ID, e.g. "wx_" gives wx_rainy.
      selector:
        text:
          multiline: false
          multiple: false
      default: ''
    graph_color:
      name: Graph Color
      description: Select the Graph color.
      selector:
        color_rgb: {}
      default:
      - 60
      - 150
      - 255
    text_color:
      name: Text Color
      description: Color of the total and of the "no rain" text.
      selector:
        color_rgb: {}
      default:
      - 255
      - 255
      - 255
    background_color:
      name: Background Color
      description: Select the Background color. Ignored when an effect is chosen.
      selector:
        color_rgb: {}
      default:
      - 0
      - 0
      - 0
    text_case:
      name: Text Case
      description: Select how you would like your text to display.
      selector:
        select:
          options:
          - label: Use global setting
            value: inherit
          - label: Force Uppercase
            value: upper
          - label: Show as you entered it
            value: asTyped
          mode: dropdown
          multiple: false
          custom_value: false
          sort: false
      default: inherit
    show_rainbow:
      name: Rainbow Colors
      description: Should the text and chart be shown in Rainbow colors?
      selector:
        boolean: {}
      default: false
    repeat_count:
      name: Repeat
      description: How many times a scrolling text runs through its box before the
        app ends. 0 turns it off and the duration is used instead.
      selector:
        text:
          multiline: false
          multiple: false
      default: '2'
    duration:
      name: Duration (in seconds)
      description: Sets how long the app should be displayed. 0 is global app time.
      selector:
        text:
          multiline: false
          multiple: false
      default: '0'
    lifetime:
      name: Lifetime (in seconds)
      description: How long the app stays alive before it is removed from the app
        cycle automatically. 0 is infinite lifetime.
      selector:
        text:
          multiline: false
          multiple: false
      default: '0'
    lifetime_expiry:
      name: On lifetime expiry
      description: What happens when the lifetime runs out. "Remove" drops the app
        from the rotation, "Mark" keeps it and draws a dark red frame around it.
      selector:
        select:
          options:
          - label: Remove the app
            value: remove
          - label: Mark the app as stale
            value: mark
          mode: dropdown
          multiple: false
          custom_value: false
          sort: false
      default: remove
    switch_to_app:
      name: Switch to app on value change
      description: Should the clock switch to the app immediately when the forecast
        changes?
      selector:
        boolean: {}
      default: false
    scroll:
      name: Scroll the text?
      description: Enables scrolling of texts that don't fit.
      selector:
        boolean: {}
      default: true
    scrollspeed:
      name: Scroll Speed Percentage
      description: Modifies the scrollspeed. You need to enter a percentage value.
      selector:
        number:
          mode: slider
          min: 0.0
          max: 200.0
          step: 1.0
      default: 100
    effect:
      name: Effect
      description: Select a background effect (optional).
      selector:
        select:
          options:
          - label: None
            value: ''
          - label: BrickBreaker
            value: BrickBreaker
          - label: Checkerboard
            value: Checkerboard
          - label: ColorWaves
            value: ColorWaves
          - label: Fade
            value: Fade
          - label: Fireworks
            value: Fireworks
          - label: LookingEyes
            value: LookingEyes
          - label: Matrix
            value: Matrix
          - label: MovingLine
            value: MovingLine
          - label: PingPong
            value: PingPong
          - label: Pacifica
            value: Pacifica
          - label: Plasma
            value: Plasma
          - label: PlasmaCloud
            value: PlasmaCloud
          - label: Radar
            value: Radar
          - label: Ripple
            value: Ripple
          - label: Snake
            value: Snake
          - label: SwirlIn
            value: SwirlIn
          - label: SwirlOut
            value: SwirlOut
          - label: TheaterChase
            value: TheaterChase
          - label: TwinklingStars
            value: TwinklingStars
          mode: dropdown
          multiple: false
          custom_value: false
          sort: false
      default: ''
    overlay:
      name: Weather Overlay
      description: Optional AWTRIX NG weather overlay drawn on top of the app. "Follow
        device setting" leaves the global overlay in charge.
      selector:
        select:
          options:
          - label: Follow device setting
            value: ''
          - label: Drizzle
            value: drizzle
          - label: Frost
            value: frost
          - label: Rain
            value: rain
          - label: Snow
            value: snow
          - label: Storm
            value: storm
          - label: Thunder
            value: thunder
          mode: dropdown
          multiple: false
          custom_value: false
          sort: false
      default: ''
mode: queued
triggers:
- trigger: homeassistant
  event: start
- trigger: state
  entity_id: !input my_sensor
  for:
    seconds: 2
variables:
  device_ids: !input awtrix_displays
  extra_prefixes: !input extra_prefixes
  my_sensor: !input my_sensor
  hours: !input hours
  v_language: !input language
  my_custom_text: !input my_text
  graph_type: !input graph_type
  show_total: !input show_total
  autoscale: !input autoscale
  chart_max: !input chart_max
  icon_source: !input icon_source
  icon_prefix: !input icon_prefix
  graph_color: !input graph_color
  text_color: !input text_color
  background_color: !input background_color
  text_case: !input text_case
  show_rainbow: !input show_rainbow
  my_repeat: !input repeat_count
  my_duration: !input duration
  my_lifetime: !input lifetime
  lifetime_expiry: !input lifetime_expiry
  switch_to_app: !input switch_to_app
  scrolling: !input scroll
  scroll_speed: !input scrollspeed
  effect: !input effect
  overlay: !input overlay
  app_name: rain_forecast
  targets: "{% set ns = namespace(t=[]) %} {% for device_id in device_ids %}\n  {%
    set found = device_entities(device_id) | select('search', 'mqtt_prefix') | list
    %}\n  {% if found %}\n    {% set ns.t = ns.t + [states(found[0])] %}\n  {% endif
    %}\n{% endfor %} {% set ns.t = ns.t + (extra_prefixes | list) %} {{ ns.t | map('trim')
    | reject('in', ['', 'unknown', 'unavailable']) | unique | list }}"
  builtin_icons:
    clear-night: 
    cloudy: 
    exceptional: 
    fog: 
    hail: 
    lightning: 
    lightning-rainy: 
    partlycloudy: 
    pouring: 
    rainy: 
    snowy: 
    snowy-rainy: 
    sunny: 
    windy: 
    windy-variant: 
conditions:
- condition: not
  conditions:
  - condition: state
    entity_id: !input my_sensor
    state:
    - unavailable
    - unknown
actions:
- action: weather.get_forecasts
  data:
    type: hourly
  response_variable: my_forecast
  target:
    entity_id: !input my_sensor
  continue_on_error: true
- variables:
    rain_tenths: "{% set f = (my_forecast[my_sensor].forecast\n            if my_forecast
      is defined and my_sensor in my_forecast\n            else state_attr(my_sensor,
      'forecast')) or [] %}\n{{ f[:hours | int(12)] | map(attribute='precipitation')\n
      \  | map('float', 0) | map('multiply', 10) | map('round', 0) | map('int') |
      list }}"
    no_rain_text: "{% set no_rain_by_lang = {\n  'en': 'No rain expected', 'dk': 'Ingen
      regn forventet',\n  'nl': 'Geen regen verwacht', 'de': 'Kein Regen erwartet',\n
      \ 'fr': 'Pas de pluie prévue', 'es': 'No se espera lluvia',\n  'it': 'Nessuna
      pioggia prevista', 'pl': 'Brak opadów deszczu',\n  'pt': 'Sem previsão de chuva',
      'ru': 'Дождь не ожидается'\n} %} {{ my_custom_text if my_custom_text | trim
      != '' else\n   no_rain_by_lang.get(v_language, no_rain_by_lang['en']) }}"
    icon_value: "{% set s = states(my_sensor) %} {% if icon_source == 'builtin' %}\n
      \ {{ 'data:image/gif;base64,' ~ builtin_icons.get(s, builtin_icons['exceptional'])
      }}\n{% elif icon_source == 'clock' %}\n  {{ (icon_prefix | default('', true)
      | trim) ~ s }}\n{% endif %}"
    app_payload: "{% set data = rain_tenths | from_json if rain_tenths is string else
      rain_tenths %} {% set icon = icon_value | trim %} {% set x0 = 18 if icon else
      0 %} {% set w = 52 - x0 %} {% set scroll = {'mode': 'loop', 'gap': 12, 'speed':
      scroll_speed | int(100)}\n                if scrolling else 'static' %}\n{%
      set c_text = {'textColor': 'palette', 'palette': 'Rainbow'} if show_rainbow\n
      \               else {'color': text_color} %}\n{% set c_chart = {'color': 'palette',
      'palette': 'Rainbow'} if show_rainbow\n                 else {'color': graph_color}
      %}\n{% set ns = namespace(r=[]) %} {% if icon %}\n  {% set ns.r = ns.r + [{'id':
      'icon', 'box': [0, 0, 16, 16], 'icon': icon}] %}\n{% endif %} {% if (data |
      sum) > 0 %}\n  {% set chart = {'values': data, 'type': graph_type} %}\n  {%
      if not autoscale %}\n    {% set chart = dict(chart, min=0, max=[(chart_max |
      float(5) * 10) | round(0) | int, 1] | max) %}\n  {% endif %}\n  {% if show_total
      %}\n    {% set total = '%.1f' | format((data | sum) / 10) ~ ' mm' %}\n    {%
      set ns.r = ns.r + [\n      dict({'id': 'total', 'box': [x0, 0, w, 7], 'text':
      total,\n            'scroll': scroll, 'textCase': 'asTyped'}, **c_text),\n      dict({'id':
      'chart', 'box': [x0, 7, w, 9], 'chart': chart}, **c_chart)\n    ] %}\n  {% else
      %}\n    {% set ns.r = ns.r + [\n      dict({'id': 'chart', 'box': [x0, 0, w,
      16], 'chart': chart}, **c_chart)\n    ] %}\n  {% endif %}\n{% else %}\n  {%
      set ns.r = ns.r + [\n    dict({'id': 'norain', 'box': [x0, 0, w, 16], 'text':
      no_rain_text | trim,\n          'scroll': scroll, 'textCase': text_case}, **c_text)\n
      \ ] %}\n{% endif %} {% set layout = {'version': 1, 'regions': ns.r} %} {% if
      effect %}\n  {% set layout = dict(layout, effect=effect) %}\n{% else %}\n  {%
      set layout = dict(layout, backgroundColor=background_color) %}\n{% endif %}
      {% if overlay %}\n  {% set layout = dict(layout, overlay=overlay) %}\n{% endif
      %} {{ {\n     'repeat': my_repeat | int(0),\n     'durationMs': (my_duration
      | int(0)) * 1000,\n     'lifetimeMs': (my_lifetime | int(0)) * 1000,\n     'lifetimeExpiry':
      lifetime_expiry,\n     'layout': layout\n   } | tojson }}"
- repeat:
    for_each: '{{ targets }}'
    sequence:
    - action: mqtt.publish
      data:
        qos: 0
        retain: false
        evaluate_payload: false
        topic: '{{ repeat.item ~ ''/cmd/apps/pushed/'' ~ app_name }}'
        payload: '{{ app_payload }}'
    - condition: template
      value_template: '{{ switch_to_app == true }}'
    - action: mqtt.publish
      data:
        qos: 0
        retain: false
        topic: '{{ repeat.item ~ ''/cmd/apps/switch'' }}'
        payload: '{{ app_name }}'